<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Quiz – Μορφοποίηση Κειμένου</title><style>:root{--b:#168fbd;--y:#ffd84d;--bg:#f5fbfe;--t:#173042;--l:#d9eaf2;--ok:#17834f;--bad:#b43b3b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}.app{max-width:900px;margin:auto;padding:22px}.head{background:var(--b);color:#fff;border-radius:18px;padding:20px 24px}.head h1{margin:0 0 6px}.bar{height:12px;background:#dcecf3;border-radius:20px;overflow:hidden;margin:18px 0 12px}.prog{height:100%;background:var(--y);width:0;transition:.3s}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:24px;box-shadow:0 8px 25px #0a668012}.meta{display:flex;justify-content:space-between;color:#607583;font-weight:bold}.q{font-size:24px;font-weight:bold;line-height:1.35;margin:16px 0}.opts{display:grid;gap:12px}.opt{border:2px solid var(--l);background:#fff;border-radius:13px;padding:15px;text-align:left;font-size:17px;cursor:pointer}.opt:hover{border-color:var(--b)}.opt.correct{border-color:var(--ok);background:#eaf8f1}.opt.wrong{border-color:var(--bad);background:#fff0f0}.fb{display:none;margin-top:18px;padding:14px;border-radius:12px;font-weight:bold}.fb.ok{display:block;background:#eaf8f1;color:#11643c}.fb.bad{display:block;background:#fff0f0;color:#8d2e2e}.actions{text-align:right;margin-top:18px}.next,.restart{display:none;border:0;background:var(--b);color:#fff;font-weight:bold;font-size:17px;padding:12px 20px;border-radius:12px;cursor:pointer}.result{text-align:center}.score{font-size:64px;font-weight:800;color:var(--b)}.restart{display:inline-block}@media(max-width:600px){.app{padding:12px}.card{padding:18px}.q{font-size:20px}}</style></head><body><div class="app"><div class="head"><h1>Mini Quiz: Μορφοποίηση Κειμένου</h1><div>Έλεγξε τι έμαθες για τη μορφοποίηση χαρακτήρων στο PowerPoint.</div></div><div class="bar"><div class="prog" id="prog"></div></div><main class="card" id="card"></main></div><script>
const qs=[
['Η Μαρία θέλει να κάνει μία σημαντική λέξη πιο έντονη. Ποια μορφοποίηση πρέπει να χρησιμοποιήσει;',['Italic (Πλάγια)','Bold (Έντονα)','Underline (Υπογράμμιση)','Shadow (Σκιά)'],1,'Το Bold (Έντονα) κάνει τους χαρακτήρες να εμφανίζονται με πιο έντονη γραφή.'],
['Ποια επιλογή χρησιμοποιούμε για να αλλάξουμε το μέγεθος των χαρακτήρων;',['Font Color (Χρώμα γραμματοσειράς)','Font Size (Μέγεθος γραμματοσειράς)','Change Case (Αλλαγή πεζών-κεφαλαίων)','Shadow (Σκιά)'],1,'Με το Font Size (Μέγεθος γραμματοσειράς) επιλέγουμε το μέγεθος των χαρακτήρων.'],
['Ο Αντρέας έγραψε μια φράση με πεζά και θέλει να την εμφανίσει ολόκληρη με κεφαλαία, χωρίς να την ξαναγράψει. Τι πρέπει να επιλέξει;',['Sentence case','lowercase','UPPERCASE','Capitalize Each Word'],2,'Η επιλογή UPPERCASE εμφανίζει όλους τους χαρακτήρες ως κεφαλαία.'],
['Η Σοφία θέλει να αλλάξει το χρώμα μιας λέξης. Τι πρέπει να κάνει πρώτα;',['Να επιλέξει τη λέξη','Να αλλάξει το φόντο','Να πατήσει Apply to All','Να αλλάξει το μέγεθος της διαφάνειας'],0,'Πριν εφαρμόσουμε μορφοποίηση, επιλέγουμε πρώτα το κείμενο που θέλουμε να αλλάξουμε.'],
['Ποια μορφοποίηση προσθέτει σκιά πίσω από τους χαρακτήρες;',['Underline','Italic','Shadow','Bold'],2,'Η επιλογή Shadow (Σκιά) προσθέτει σκιά πίσω από τους χαρακτήρες.'],
['Το κείμενο μιας διαφάνειας έχει σχεδόν το ίδιο χρώμα με το φόντο και δυσκολεύει την ανάγνωση. Ποια είναι η καλύτερη ενέργεια;',['Να χρησιμοποιήσουμε περισσότερες γραμματοσειρές','Να μειώσουμε πολύ το μέγεθος','Να επιλέξουμε χρώμα κειμένου με μεγαλύτερη αντίθεση από το φόντο','Να εφαρμόσουμε όλες τις μορφοποιήσεις μαζί'],2,'Η καλή αντίθεση ανάμεσα στο κείμενο και το φόντο βοηθά το περιεχόμενο να διαβάζεται εύκολα.']];
let i=0,s=0,lock=false;const card=document.getElementById('card'),prog=document.getElementById('prog');function render(){lock=false;prog.style.width=(i/qs.length*100)+'%';let x=qs[i];card.innerHTML=`<div class="meta"><span>Ερώτηση ${i+1} από ${qs.length}</span><span>Βαθμολογία: ${s}</span></div><div class="q">${x[0]}</div><div class="opts">${x[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('')}</div><div class="fb" id="fb"></div><div class="actions"><button class="next" id="next">${i===qs.length-1?'Αποτελέσματα':'Επόμενη'}</button></div>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));document.getElementById('next').onclick=next}function answer(n){if(lock)return;lock=true;let x=qs[i],bs=[...document.querySelectorAll('.opt')],fb=document.getElementById('fb');bs.forEach(b=>b.disabled=true);bs[x[2]].classList.add('correct');if(n===x[2]){s++;fb.className='fb ok';fb.innerHTML='✓ Σωστά! '+x[3]}else{bs[n].classList.add('wrong');fb.className='fb bad';fb.innerHTML='✗ Όχι ακριβώς. '+x[3]}document.getElementById('next').style.display='inline-block'}function next(){i++;i<qs.length?render():results()}function results(){prog.style.width='100%';let p=Math.round(s/qs.length*100),m=p===100?'Εξαιρετικά! Τα κατάφερες όλα.':p>=67?'Πολύ καλά! Έχεις κατανοήσει τα βασικά.':'Καλή προσπάθεια! Δες ξανά τις ενότητες και δοκίμασε πάλι.',st=p===100?'⭐⭐⭐':p>=67?'⭐⭐':'⭐';card.innerHTML=`<div class="result"><h2>Ολοκλήρωσες το Quiz!</h2><div class="score">${s}/${qs.length}</div><div style="font-size:35px">${st}</div><p style="font-size:20px">${m}</p><button class="restart" onclick="restart()">Προσπάθησε ξανά</button></div>`}function restart(){i=0;s=0;render()}render();
</script></body></html>
