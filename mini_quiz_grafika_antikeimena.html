<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Quiz – Γραφικά Αντικείμενα</title><style>
body{font-family:Arial,sans-serif;background:#eef8fd;color:#173247;margin:0}.w{max-width:850px;margin:auto;padding:25px}header,.card{background:white;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #0001}header{border-top:7px solid #087cc1}h1{color:#087cc1;margin:0}.bar{height:10px;background:#e4edf2;border-radius:20px;margin-top:18px;overflow:hidden}.bar i{display:block;height:100%;background:#087cc1;width:0}.q{font-size:20px;font-weight:bold;margin:16px 0}.n{background:#087cc1;color:white;padding:6px 11px;border-radius:20px}.o{display:block;width:100%;text-align:left;padding:12px;margin:9px 0;border:2px solid #d7e5ed;border-radius:11px;background:white;font-size:16px}.o.ok{background:#eaf9f1;border-color:#169b62}.o.no{background:#fff0f0;border-color:#d83a3a}.fb{padding:12px;border-radius:10px;margin-top:13px}.good{background:#eaf9f1}.bad{background:#fff0f0}.next,.retry{background:#087cc1;color:white;border:0;border-radius:10px;padding:11px 18px;font-weight:bold;margin-top:14px}.score{text-align:center;font-size:48px;color:#087cc1;font-weight:bold}
</style></head><body><div class="w"><header><h1>Επαναληπτικές Ερωτήσεις</h1><p>Κεφάλαιο 7 – Γραφικά Αντικείμενα</p><div class="bar"><i id="b"></i></div><p id="c"></p></header><div class="card" id="quiz"></div></div>
<script>
const Q=[
["Θέλεις να εισαγάγεις μια εικόνα που είναι αποθηκευμένη στον υπολογιστή σου. Ποια διαδρομή θα ακολουθήσεις;",["Insert → Pictures → This Device","Design → Pictures → This Device","Insert → Shapes → Picture","Home → Pictures → Online Pictures"],0,"Insert → Pictures → This Device χρησιμοποιείται για εικόνες που είναι αποθηκευμένες στον υπολογιστή."],
["Ποια επιλογή πρέπει να είναι ενεργοποιημένη ώστε να διατηρούνται οι αναλογίες μιας εικόνας όταν αλλάζουμε το μέγεθός της;",["Lock Aspect Ratio","Shape Outline","Align to Slide","Group"],0,"Με ενεργό το Lock Aspect Ratio διατηρείται η αναλογία ύψους και πλάτους."],
["Ποια πρόταση περιγράφει σωστά τα Shape Fill και Shape Outline;",["Shape Fill αλλάζει το εσωτερικό και Shape Outline το περίγραμμα.","Shape Fill αλλάζει το περίγραμμα και Shape Outline το εσωτερικό.","Και τα δύο αλλάζουν μόνο το μέγεθος.","Και τα δύο χρησιμοποιούνται για περιστροφή."],0,"Shape Fill αφορά το εσωτερικό του σχήματος, ενώ Shape Outline το περίγραμμά του."],
["Ποια εντολή αναστρέφει ένα αντικείμενο από δεξιά προς τα αριστερά;",["Rotate Right 90°","Flip Horizontal","Flip Vertical","Rotate Left 90°"],1,"Η Flip Horizontal κάνει οριζόντια αναστροφή, δηλαδή δεξιά–αριστερά."],
["Θέλεις τρία επιλεγμένα σχήματα να στοιχιστούν μεταξύ τους. Ποια επιλογή θα χρησιμοποιήσεις;",["Align to Slide","Align Selected Objects","Distribute Vertically","Send to Back"],1,"Η Align Selected Objects στοιχίζει τα επιλεγμένα αντικείμενα μεταξύ τους."],
["Ποια εντολή τοποθετεί αντικείμενα σε ίσες οριζόντιες αποστάσεις;",["Align Center","Distribute Horizontally","Align Middle","Distribute Vertically"],1,"Η Distribute Horizontally δημιουργεί ίσες οριζόντιες αποστάσεις."],
["Θέλεις πολλά αντικείμενα να μετακινούνται και να αλλάζουν μέγεθος σαν να είναι ένα. Τι κάνεις;",["Group","Ungroup","Flip Horizontal","Align to Slide"],0,"Με την Group τα επιλεγμένα αντικείμενα λειτουργούν σαν ένα."],
["Ποια είναι η διαφορά μεταξύ Bring Forward και Bring to Front;",["Bring Forward: μία θέση μπροστά · Bring to Front: μπροστά από όλα.","Bring Forward: πίσω · Bring to Front: μπροστά.","Δεν υπάρχει διαφορά.","Η πρώτη ομαδοποιεί και η δεύτερη διαχωρίζει."],0,"Bring Forward μετακινεί μία θέση προς τα εμπρός, ενώ Bring to Front μπροστά από όλα."],
["Θέλεις να μεταφέρεις ένα αντικείμενο πίσω από όλα τα άλλα. Ποια εντολή χρησιμοποιείς;",["Send Backward","Send to Back","Bring Forward","Bring to Front"],1,"Η Send to Back μετακινεί το αντικείμενο πίσω από όλα τα άλλα."],
["Σωστό ή Λάθος: Η εντολή Ungroup ενώνει πολλά αντικείμενα ώστε να λειτουργούν σαν ένα.",["Σωστό","Λάθος"],1,"Λάθος. Η Ungroup διαχωρίζει τα αντικείμενα μιας ομάδας. Η Group τα ενώνει."]
];let k=0,s=0;
function draw(){let q=Q[k];c.textContent=`${k+1} / ${Q.length}`;b.style.width=`${k/Q.length*100}%`;quiz.innerHTML=`<span class=n>Ερώτηση ${k+1}</span><div class=q>${q[0]}</div>`+q[1].map((x,i)=>`<button class=o onclick="ans(${i})">${x}</button>`).join("")}
function ans(i){let q=Q[k],bs=[...document.querySelectorAll(".o")];bs.forEach(x=>x.disabled=true);bs[q[2]].classList.add("ok");let good=i===q[2];if(good)s++;else bs[i].classList.add("no");quiz.innerHTML+=`<div class="fb ${good?'good':'bad'}"><b>${good?'✓ Σωστά!':'✗ Όχι ακριβώς.'}</b> ${q[3]}</div><button class=next onclick=nx()>${k==Q.length-1?'Αποτελέσματα':'Επόμενη →'}</button>`;b.style.width=`${(k+1)/Q.length*100}%`}
function nx(){if(++k<Q.length)draw();else{c.textContent="Ολοκληρώθηκε";quiz.innerHTML=`<div class=score>${s} / ${Q.length}</div><p style="text-align:center">Ολοκλήρωσες τις επαναληπτικές ερωτήσεις.</p><div style="text-align:center"><button class=retry onclick="k=0;s=0;draw()">Δοκίμασε ξανά</button></div>`}}
draw();</script></body></html>
