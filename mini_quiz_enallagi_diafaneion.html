<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Quiz - Εναλλαγή Διαφανειών</title>
<style>body{font-family:Arial;background:#f4f8fb;margin:0;color:#24313b}.c{max-width:800px;margin:24px auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 5px 20px #0002}h1{color:#1675a6}.p{height:10px;background:#e5eef3;border-radius:8px;overflow:hidden}.b{height:100%;background:#35a9e0}.o{display:block;width:100%;text-align:left;padding:13px;margin:10px 0;border:2px solid #d8e3ea;border-radius:11px;background:#fff;font-size:16px;cursor:pointer}.o:hover{background:#eef9fd}.ok{color:#16833a;font-weight:bold}.no{color:#c0392b;font-weight:bold}.n{float:right;padding:10px 18px;border:0;border-radius:9px;background:#1675a6;color:#fff;font-size:16px}.n:disabled{opacity:.4}.r{text-align:center}.score{font-size:48px;color:#1675a6;font-weight:bold}</style></head><body><div class="c"><h1>Mini Quiz – Εναλλαγή Διαφανειών</h1><p>Έλεγξε όσα έμαθες για τα εφέ εναλλαγής στο PowerPoint.</p><div class="p"><div class="b" id="bar"></div></div><div id="q"></div></div>
<script>
const Q=[
["Ποια επιλογή εφαρμόζει τις ίδιες ρυθμίσεις εναλλαγής σε όλες τις διαφάνειες;",["Preview","Effect Options","Apply To All","Duration"],2,"Το Apply To All εφαρμόζει τις ρυθμίσεις σε όλες τις διαφάνειες."],
["Τι καθορίζει η επιλογή Duration (Διάρκεια);",["Πόσο χρόνο διαρκεί το εφέ εναλλαγής.","Μετά από πόσο χρόνο εμφανίζεται η επόμενη διαφάνεια.","Πόσο χρόνο παραμένει ανοικτή η παρουσίαση.","Πότε ξεκινά η παρουσίαση."],0,"Το Duration καθορίζει πόσο χρόνο διαρκεί το εφέ εναλλαγής."],
["Θέλουμε αυτόματη μετάβαση στην επόμενη διαφάνεια μετά από 5 δευτερόλεπτα. Τι χρησιμοποιούμε;",["Duration: 00:05.00","After: 00:05.00","On Mouse Click","Preview"],1,"Με το After καθορίζουμε πότε γίνεται αυτόματα η μετάβαση."],
["Η επιλογή None (Καμία) αφαιρεί το εφέ εναλλαγής από την επιλεγμένη διαφάνεια.",["Σωστό","Λάθος"],0,"Με το None αφαιρούμε το εφέ εναλλαγής."],
["Έχουμε εφαρμόσει Wipe και θέλουμε να αλλάξουμε την κατεύθυνσή του. Τι χρησιμοποιούμε;",["Sound","Duration","Preview","Effect Options"],3,"Το Effect Options αλλάζει τις διαθέσιμες παραλλαγές του εφέ."],
["Ποια πρόταση εξηγεί σωστά τη διαφορά Duration και After;",["Duration = διάρκεια του εφέ, After = χρόνος μέχρι την αυτόματη μετάβαση.","Κάνουν ακριβώς το ίδιο.","Duration = ήχος, After = κατεύθυνση.","Duration = κλικ, After = εφαρμογή σε όλες."],0,"Duration = διάρκεια του εφέ, ενώ After = χρόνος μέχρι την αυτόματη μετάβαση."],
["Ποια επιλογή μάς επιτρέπει να δούμε το αποτέλεσμα του εφέ χωρίς να ξεκινήσουμε ολόκληρη την παρουσίαση;",["Sound","Preview","None","Apply To All"],1,"Το Preview εμφανίζει προεπισκόπηση του εφέ."]
];let i=0,s=0,done=false;
function show(){done=false;let x=Q[i];bar.style.width=(i/Q.length*100)+"%";q.innerHTML=`<h2>${i+1}. ${x[0]}</h2>${x[1].map((v,j)=>`<button class=o onclick="ans(${j},this)">${v}</button>`).join("")}<p id=f></p><button id=next class=n disabled onclick=go()>${i==Q.length-1?"Αποτελέσματα":"Επόμενη"}</button><div style="clear:both"></div>`}
function ans(a,e){if(done)return;if(a==Q[i][2]){done=true;s++;f.className="ok";f.textContent="✓ Σωστά! "+Q[i][3];document.querySelectorAll(".o").forEach(x=>x.disabled=true);next.disabled=false}else{f.className="no";f.textContent="✗ Δοκίμασε ξανά."}}
function go(){i++;if(i<Q.length)show();else result()}
function result(){bar.style.width="100%";let m=s==Q.length?"Εξαιρετικά!":s>=5?"Πολύ καλά!":"Κάνε μια σύντομη επανάληψη και προσπάθησε ξανά.";q.innerHTML=`<div class=r><h2>Ολοκλήρωσες το quiz!</h2><div class=score>${s} / ${Q.length}</div><p>${m}</p><button class=n style="float:none" onclick="restart()">Προσπάθησε ξανά</button></div>`}
function restart(){i=0;s=0;show()}show();
</script></body></html>
